<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{width:1600px;height:400px;margin:0;overflow:hidden;background:#050708}
body{font-family:Consolas,"Courier New",monospace;color:#f4f7ef}
.signature{
    position:relative;
    width:1600px;
    height:400px;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
        radial-gradient(ellipse at 50% 48%,rgba(136,216,47,.14),transparent 34%),
        radial-gradient(ellipse at 17% 110%,rgba(85,215,223,.07),transparent 38%),
        radial-gradient(ellipse at 84% -15%,rgba(136,216,47,.075),transparent 38%),
        linear-gradient(180deg,#0d1215 0%,#080b0d 58%,#050708 100%);
}
.signature::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.22;
    background-image:
        linear-gradient(rgba(136,216,47,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(136,216,47,.12) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at center,#000 8%,transparent 76%);
}
.signature::after{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(136,216,47,.38);
    border-radius:26px 5px 26px 5px;
    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        inset 0 0 70px rgba(136,216,47,.025),
        0 0 42px rgba(136,216,47,.075);
}
.rail{position:absolute;top:50%;width:290px;height:1px;background:linear-gradient(90deg,transparent,rgba(136,216,47,.72));box-shadow:0 0 14px rgba(136,216,47,.4)}
.rail::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:#c9ff69;box-shadow:0 0 18px #88d82f}
.rail.left{left:70px}
.rail.right{right:70px;transform:scaleX(-1)}
.lockup{position:relative;z-index:2;display:flex;align-items:center;gap:42px;filter:drop-shadow(0 18px 38px rgba(0,0,0,.58))}
.brand-mark{
    width:132px;
    height:132px;
    position:relative;
    display:grid;
    place-items:center;
    flex:0 0 auto;
    border:2px solid rgba(136,216,47,.55);
    border-radius:32px 8px 32px 8px;
    overflow:hidden;
    background:
        linear-gradient(145deg,rgba(136,216,47,.28),transparent 52%),
        #11161a;
    box-shadow:
        inset 0 2px rgba(255,255,255,.1),
        inset 0 0 34px rgba(136,216,47,.055),
        0 0 54px rgba(136,216,47,.16);
}
.brand-mark::before,.brand-mark::after{
    content:"";
    position:absolute;
    width:18px;
    height:100px;
    border-radius:5px;
    background:linear-gradient(#efffdb,#78c92b);
    box-shadow:0 0 27px rgba(136,216,47,.55);
}
.brand-mark::before{transform:rotate(36deg)}
.brand-mark::after{transform:rotate(-36deg)}
.copy{min-width:620px}
.brand-name{
    margin:0;
    font:800 112px/.78 "Bahnschrift Condensed","Arial Narrow",sans-serif;
    letter-spacing:.035em;
    text-transform:uppercase;
    color:#f7faf3;
    text-shadow:0 5px 25px rgba(0,0,0,.72);
}
.brand-name span{color:#88d82f;text-shadow:0 0 26px rgba(136,216,47,.38)}
.brand-subtitle{
    margin:20px 0 0 4px;
    color:#9da9a2;
    font-size:22px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    white-space:nowrap;
}
.divider{width:100%;height:1px;margin:23px 0 18px;background:linear-gradient(90deg,rgba(136,216,47,.7),rgba(136,216,47,.1),transparent);box-shadow:0 0 12px rgba(136,216,47,.18)}
.motto{margin:0 0 0 4px;color:#e8ede5;font:700 19px/1.2 Consolas,"Courier New",monospace;letter-spacing:.16em;text-transform:uppercase}
.motto span{color:#a6db3b}
.corner{position:absolute;z-index:2;color:rgba(136,216,47,.55);font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.corner.top{top:38px;left:52px}
.corner.bottom{right:50px;bottom:37px;color:rgba(157,169,162,.42)}
</style>
</head>
<body>
<main class="signature">
    <div class="rail left"></div>
    <div class="rail right"></div>
    <div class="corner top">Private stock intelligence</div>
    <div class="corner bottom">Prediction engine / UTC</div>
    <section class="lockup" aria-label="TornX — Torn Stock Market Predictor">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="copy">
            <h1 class="brand-name">Torn<span>X</span></h1>
            <p class="brand-subtitle">Torn Stock Market Predictor</p>
            <div class="divider"></div>
            <p class="motto">Read the signal. <span>Own the window.</span></p>
        </div>
    </section>
</main>
</body>
</html>
